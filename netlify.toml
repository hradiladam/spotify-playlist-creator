[build]
  # project root is now the app root
  command = "npm run build"
  publish = "dist"

[functions]
  # functions live at repo root/netlify/functions
  directory = "netlify/functions"

[dev]
  # run Vite from root; Netlify will proxy it
  command    = "npm run dev"
  targetPort = 5173
  port       = 8888

[[redirects]]
  # SPA routing so /callback (and other routes) don’t 404
  from = "/*"
  to   = "/index.html"
  status = 200