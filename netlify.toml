[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[dev]
  command    = "npm run dev"
  targetPort = 5173
  port       = 8888
  framework  = "#custom"

# --- SPA fallback only in production ---
[context.production]
  [[redirects]]
    from = "/*"
    to   = "/index.html"
    status = 200
