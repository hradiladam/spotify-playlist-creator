[build]
  base    = "FRONTEND"
  command = "npm run build"
  publish = "dist"

[functions]
  # Relative to the base dir above → go up to repo root
  directory = "../netlify/functions"

[dev]
  # Run Vite from FRONTEND when using `netlify dev`
  command    = "npm run dev --prefix FRONTEND"
  targetPort = 5173
  port       = 8888

[[redirects]]
  # SPA routing so /callback (and other routes) don’t 404
  from = "/*"
  to   = "/index.html"
  status = 200